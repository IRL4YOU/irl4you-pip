.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 0}
.row .n{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .v{white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;margin-left:.55em;padding:0 .55em;border-radius:99px;font-size:.7em;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--label);background:var(--track);border:1px solid var(--edge);vertical-align:.12em;text-shadow:none}
.sub{color:var(--muted);font-size:.85em;margin-left:.4em}
.sec{color:var(--muted);font-size:.8em;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.good{color:var(--good)}.middle{color:var(--middle)}.bad{color:var(--bad)}.muted{color:var(--muted)}
.alert{color:var(--middle);font-size:.9em}.alert.err{color:var(--bad)}
#msg{color:var(--bad);font-size:.85em;text-align:center;display:none}
.stale{opacity:.55}
.bar{height:5px;background:var(--track);border:1px solid var(--track);border-radius:4px;margin:2px 0 6px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 60%),var(--good);box-shadow:0 0 8px var(--good)}
.bar i.middle{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 60%),var(--middle);box-shadow:0 0 8px var(--middle)}
.bar i.bad{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 60%),var(--bad);box-shadow:0 0 8px var(--bad)}
/* Box nicht erreichbar: nur noch ein Wort */
#offline{display:none;align-items:center;justify-self:start;width:max-content;max-width:100%;padding:9px 20px;border-color:rgba(244,67,54,.55);font-size:1.15em;font-weight:700;letter-spacing:.02em}
#offline b{color:var(--label);font-weight:700}
.isoff #offline{display:flex}
.isoff>:not(#offline){display:none!important}
@media (prefers-reduced-transparency:reduce){.card{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(20,28,44,.82)}}
